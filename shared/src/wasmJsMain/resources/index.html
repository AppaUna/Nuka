<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Nuka</title>

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nuka">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #compose-root {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FF9800;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div id="compose-root">
    <div class="loading">Загрузка Nuka...</div>
</div>

<script>
    window.nukaBytes = {
        buffer: null,
        init: function(size) {
            this.buffer = new Uint8Array(size);
        },
        set: function(index, value) {
            this.buffer[index] = value;
        },
        toAudioUrl: function() {
            const blob = new Blob([this.buffer], {type: 'audio/mp4'});
            return URL.createObjectURL(blob);
        }
    };
</script>

<script>
    // Разблокировка audio при первом взаимодействии
    (function() {
        var unlocked = false;
        function unlockAudio() {
            if (unlocked) return;
            unlocked = true;
            try {
                if (!window.__nukaAudio) {
                    window.__nukaAudio = new Audio();
                }
                // Ставим громкость 0 чтобы не слышать
                window.__nukaAudio.volume = 0;
                // Используем реальный mp4 из ресурсов приложения
                window.__nukaAudio.src = '/composeResources/recipeapp.shared.generated.resources/files/jokes/joke_1.mp4';
                window.__nukaAudio.play().then(function() {
                    window.__nukaAudio.pause();
                    window.__nukaAudio.currentTime = 0;
                    window.__nukaAudio.volume = 1;
                    console.log('Audio unlocked ✓');
                }).catch(function(e) {
                    console.log('Unlock audio error:', e);
                    window.__nukaAudio.volume = 1;
                });
            } catch (e) {
                console.log('Unlock audio exception:', e);
            }
        }
        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('keydown', unlockAudio, { once: true });
    })();
</script>

<!-- Скрипт приложения — генерируется webpack как nuka.js -->
<script src="nuka.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('SW registered:', reg.scope))
                .catch((err) => console.error('SW error:', err));
        });
    }
</script>
</body>
</html>
