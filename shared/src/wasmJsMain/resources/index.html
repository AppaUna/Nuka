<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Nuka</title>

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nuka">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #compose-root {
            width: 100vw;
            height: 100vh;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FF9800;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div id="compose-root">
    <div class="loading">Загрузка Nuka...</div>
</div>

<!-- JS-помощники для передачи данных Kotlin ↔ JS -->
<script>
    // Для audio (Blob URL)
    window.nukaBytes = {
        buffer: null,
        init: function(size) {
            this.buffer = new Uint8Array(size);
        },
        set: function(index, value) {
            this.buffer[index] = value;
        },
        toAudioUrl: function() {
            const blob = new Blob([this.buffer], { type: 'audio/mp4' });
            return URL.createObjectURL(blob);
        }
    };

    // Для картинок (Blob URL для превью)
    window.nukaImage = {
        bytes: null,
        init: function(size) {
            this.bytes = new Uint8Array(size);
        },
        set: function(index, value) {
            this.bytes[index] = value;
        },
        toBlobUrl: function() {
            const blob = new Blob([this.bytes], { type: 'image/jpeg' });
            return URL.createObjectURL(blob);
        }
    };

    // Для canvas-энкода (ImageBitmap → JPEG)
    window.nukaCanvas = {
        // Принимает RGBA как Uint8Array (или Uint8ClampedArray), width, height, quality
        // Возвращает data URL (base64 JPEG). Синхронно.
        encodeJpegSync: function(rgbaBytes, width, height, quality) {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                // Преобразуем в Uint8ClampedArray
                const clamped = new Uint8ClampedArray(rgbaBytes.buffer, rgbaBytes.byteOffset, rgbaBytes.byteLength);

                const imageData = new ImageData(clamped, width, height);
                ctx.putImageData(imageData, 0, 0);

                return canvas.toDataURL('image/jpeg', quality);
            } catch (e) {
                console.error('encodeJpegSync error', e);
                return '';
            }
        }
    };
</script>

<!-- Разблокировка audio при первом взаимодействии (silent WAV) -->
<script>
    (function() {
        var SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        var unlocked = false;
        function unlockAudio() {
            if (unlocked) return;
            unlocked = true;
            try {
                if (!window.__nukaAudio) {
                    window.__nukaAudio = new Audio();
                }
                window.__nukaAudio.src = SILENT_WAV;
                window.__nukaAudio.play().then(function() {
                    window.__nukaAudio.pause();
                    window.__nukaAudio.currentTime = 0;
                    console.log('Audio unlocked ✓');
                }).catch(function(e) {
                    console.log('Unlock audio error:', e);
                });
            } catch (e) {
                console.log('Unlock audio exception:', e);
            }
        }
        document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        document.addEventListener('click', unlockAudio, { once: true });
    })();
</script>

<!-- Скрипт приложения — генерируется webpack как nuka.js -->
<script src="nuka.js"></script>

<!-- Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('SW registered:', reg.scope))
                .catch((err) => console.error('SW error:', err));
        });
    }
</script>
</body>
</html>
