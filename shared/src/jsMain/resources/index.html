<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Nuka</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nuka">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #compose-root { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="compose-root"></div>

<script>
    const APP_VERSION = 'v18';
    const savedVersion = localStorage.getItem('nuka_app_version');

    if (savedVersion && savedVersion !== APP_VERSION) {
        localStorage.setItem('nuka_app_version', APP_VERSION);
        window.location.replace(window.location.href.split('?')[0] + '?v=' + APP_VERSION);
    } else {
        localStorage.setItem('nuka_app_version', APP_VERSION);
    }

    let refreshing = false;
    navigator.serviceWorker?.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/js/sw.js', { scope: '/js/' })
                .then((reg) => {
                    reg.update();
                    if (reg.waiting) {
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                })
                .catch((err) => console.error('JS SW error:', err));
        });
    }
</script>

<script>
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkxNTU2NTk3LCJleHAiOjIxMDY5MTY1OTd9.7uo_yuo7gtD0UqStd4TKbjee1lhHkz_lCSLmBRCTgyI';

    window.requestPushPermission = async function() {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
            return;
        }
        try {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') { return; }

            const registration = await navigator.serviceWorker.ready;
            const response = await fetch('/push-api/vapid-public-key');
            const vapidPublicKey = await response.text();

            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
            });

            const userId = localStorage.getItem('nuka_user_id');
            if (!userId) { return; }

            const subJson = subscription.toJSON();

            await fetch(`https://nukaapp.duckdns.org:8446/api/rest/v1/push_subscriptions?user_id=eq.${userId}`, {
                method: 'DELETE',
                headers: { 'apikey': ANON_KEY }
            });

            const res = await fetch('https://nukaapp.duckdns.org:8446/api/rest/v1/push_subscriptions', {
                method: 'POST',
                headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify({ user_id: userId, endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth: subJson.keys.auth })
            });

            if (!res.ok) { return; }
            localStorage.setItem('push_enabled', 'true');
        } catch (e) { }
    };

    window.disablePushPermission = async function() {
        try {
            const userId = localStorage.getItem('nuka_user_id');
            if (!userId) { return; }
            await fetch(`https://nukaapp.duckdns.org:8446/api/rest/v1/push_subscriptions?user_id=eq.${userId}`, { method: 'DELETE', headers: { 'apikey': ANON_KEY } });
            const registration = await navigator.serviceWorker.ready;
            const subscription = await registration.pushManager.getSubscription();
            if (subscription) { await subscription.unsubscribe(); }
            localStorage.setItem('push_enabled', 'false');
        } catch (e) { }
    };

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
    }
</script>

<script>
    window.nukaCanvas = window.nukaCanvas || {};
    window.nukaCanvas.compressAsync = function(uint8Array, maxSize, quality, callback) {
        const blob = new Blob([uint8Array], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxSize || height > maxSize) {
                if (width > height) {
                    height = Math.round(height * maxSize / width);
                    width = maxSize;
                } else {
                    width = Math.round(width * maxSize / height);
                    height = maxSize;
                }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality / 100);
            URL.revokeObjectURL(url);
            callback(dataUrl.split(',')[1]);
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            callback(null);
        };
        img.src = url;
    };
</script>

<script src="shared.js"></script>
</body>
</html>
